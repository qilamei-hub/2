<script>
    const stars = document.querySelectorAll('.star-btn');
    const ratingLabel = document.getElementById('rating-label');
    const ratingLabels = ['很不满意', '不太满意', '一般', '满意', '非常满意'];

    stars.forEach((star, index) => {
      star.addEventListener('click', () => {
        stars.forEach((item, itemIndex) => {
          if (itemIndex <= index) {
            item.classList.remove('text-neutral-300');
            item.classList.add('text-neutral-900');
          } else {
            item.classList.remove('text-neutral-900');
            item.classList.add('text-neutral-300');
          }
        });
        ratingLabel.textContent = ratingLabels[index];
      });
    });

    const reviewTags = document.querySelectorAll('.review-tag');
    reviewTags.forEach((tag) => {
      tag.addEventListener('click', () => {
        const isActive = tag.getAttribute('aria-pressed') === 'true';
        tag.setAttribute('aria-pressed', String(!isActive));
        if (isActive) {
          tag.classList.remove('bg-neutral-900', 'text-white', 'border-neutral-900');
          tag.classList.add('bg-white', 'text-neutral-700', 'border-neutral-300');
        } else {
          tag.classList.remove('bg-white', 'text-neutral-700', 'border-neutral-300');
          tag.classList.add('bg-neutral-900', 'text-white', 'border-neutral-900');
        }
      });
    });

    const reviewText = document.getElementById('review-text');
    const textCount = document.getElementById('text-count');
    reviewText.addEventListener('input', () => {
      textCount.textContent = reviewText.value.length;
    });
  </script>
